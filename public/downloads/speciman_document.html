<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SPECIMAN - نموذج إمضاء</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Amiri', 'Cairo', 'Geeza Pro', 'Traditional Arabic', Arial, sans-serif;
            color: #000000;
        }
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 25mm 30mm;
            margin: 0 auto;
            position: relative;
            background: white;
        }
        .top-divider {
            width: 100%;
            height: 2px;
            background-color: #555555;
            margin-bottom: 25px;
        }
        .header-date {
            text-align: right;
            direction: ltr;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: normal;
            color: #000;
            margin-bottom: 60px;
            padding-right: 10px;
        }
        .document-title {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 22px;
            font-weight: bold;
            text-decoration: underline;
            letter-spacing: 2px;
            margin-bottom: 65px;
            text-transform: uppercase;
        }
        .content-body {
            font-size: 18px;
            line-height: 2.5;
            color: #000;
            font-family: 'Amiri', 'Traditional Arabic', 'Arial', serif;
        }
        .text-row {
            margin-bottom: 25px;
            display: flex;
            align-items: baseline;
            width: 100%;
        }
        .label-text {
            white-space: nowrap;
            margin-left: 10px;
            font-size: 18px;
        }
        .dotted-line {
            flex: 1;
            border-bottom: 1px dotted #000;
            height: 1px;
            margin-bottom: 4px;
        }
        .declaration-row {
            margin-top: 20px;
            font-size: 18px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .date-box {
            display: inline-block;
            border-bottom: 1px dotted #000;
            width: 45px;
            height: 18px;
            margin: 0 4px;
        }
        .date-box-year {
            display: inline-block;
            border-bottom: 1px dotted #000;
            width: 70px;
            height: 18px;
            margin: 0 4px;
        }
        .signature-section {
            margin-top: 90px;
            text-align: center;
        }
        .signature-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 6px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
        }
        @media print {
            body {
                background: none;
            }
            .page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100%;
                padding: 25mm 30mm;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Top Divider Line -->
        <div class="top-divider"></div>

        <!-- Header Date (Blank to fill in) -->
        <div class="header-date">
            ........................................................ : ........ / ........ / ................
        </div>

        <!-- Document Title -->
        <div class="document-title">
            SPECIMAN
        </div>

        <!-- Content Body -->
        <div class="content-body">
            <div class="text-row">
                <span class="label-text">اني الممضي اسفله</span>
                <span class="dotted-line"></span>
            </div>

            <div class="text-row">
                <span class="label-text">صاحبة بطاقة تعريف وطنية عدد</span>
                <span class="dotted-line"></span>
            </div>

            <div class="declaration-row">
                <span>بتاريخ ........... / ........... / ................ أقر أن هذا الامضاء هو امضائي.</span>
            </div>
        </div>

        <!-- Signature -->
        <div class="signature-section">
            <span class="signature-title">الامضـــــــــاء</span>
        </div>
    </div>
</body>
</html>
